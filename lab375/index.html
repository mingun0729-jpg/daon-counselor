<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다온 · 375px 검증 하네스 (임시)</title>
<style>
  body{margin:0;font:13px/1.5 system-ui,sans-serif;background:#e9ece9;color:#222}
  .row{display:flex;gap:10px;align-items:flex-start;padding:8px}
  .col{background:#fff;border:1px solid #bbb;border-radius:6px;padding:4px}
  .cap{font-weight:700;padding:2px 4px}
  iframe{border:0;background:#fff;display:block}
  pre{background:#fff;margin:8px;padding:10px;border-radius:6px;white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<div class="row">
  <div class="col"><div class="cap">375 × 812</div><iframe id="f375" src="../index.html?lab=375&v=82a6283" width="375" height="812" title="다온 375px"></iframe></div>
  <div class="col"><div class="cap">320 × 720</div><iframe id="f320" src="../index.html?lab=320&v=82a6283" width="320" height="720" title="다온 320px"></iframe></div>
</div>
<pre id="out">준비됨. window.scan(id) 로 넘침을 확인한다.</pre>
<script>
  function overflowList(win) {
    var doc = win.document;
    var vw = doc.documentElement.clientWidth;
    var rows = [];
    var all = doc.querySelectorAll('body *');
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.closest('[hidden]')) { continue; }
      var st = win.getComputedStyle(el);
      if (st.display === 'none' || st.visibility === 'hidden' || st.position === 'fixed') { continue; }
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) { continue; }
      if (r.right > vw + 1 || r.left < -1) {
        rows.push({ tag: el.tagName.toLowerCase(), id: el.id, cls: String(el.className || '').slice(0, 40), right: Math.round(r.right), left: Math.round(r.left), w: Math.round(r.width) });
      }
    }
    return {
      viewport: vw,
      docScrollWidth: doc.documentElement.scrollWidth,
      bodyScrollWidth: doc.body.scrollWidth,
      hScroll: doc.documentElement.scrollWidth > vw + 1,
      view: (win.document.querySelector('.steps [aria-current="step"]') || {}).textContent || '',
      offenders: rows.slice(0, 12),
      count: rows.length
    };
  }
  window.scan = function (which) {
    var id = which === '320' ? 'f320' : 'f375';
    var f = document.getElementById(id);
    try {
      var res = overflowList(f.contentWindow);
      document.getElementById('out').textContent = id + ' ' + JSON.stringify(res, null, 1);
      return res;
    } catch (e) {
      document.getElementById('out').textContent = id + ' 오류: ' + e.message;
      return null;
    }
  };
</script>
</body>
</html>
