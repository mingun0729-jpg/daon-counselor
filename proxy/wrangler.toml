name = "daon-codef-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2026-11-19"

# ── 배포 전에 확인하세요 ─────────────────────────────────────────────
# 1) CODEF_ENV: 처음에는 "demo"(데모 서버). 정식 계약 후 "api"로 바꿉니다.
# 2) ALLOWED_ORIGIN: 다온 페이지 주소만 허용합니다. "*"면 아무 사이트나 부를 수 있습니다.
# 3) PROXY_TOKEN: 지정하면 다온 화면의 [기관 API 연결 설정]에도 같은 토큰을 넣어야 합니다.
#    (공개 주소를 남이 써서 CODEF 쿼터를 태우는 것을 막습니다)
[vars]
CODEF_ENV = "demo"
# 쉼표로 여러 개. "null"은 index.html을 파일로 직접 열 때(file://), localhost는 python -m http.server 시연용.
# CORS는 브라우저 보호일 뿐 인증이 아니므로, 남용은 속도 제한(CHAT_RATE_PER_MIN)과 Anthropic/Cloudflare 한도로 막는다.
ALLOWED_ORIGIN = "https://mingun0729-jpg.github.io,null,http://localhost:8000,http://127.0.0.1:8000"
PROXY_TOKEN = ""

# 다온 채팅 AI 응답 — Cloudflare Workers AI(키 불필요, 계정의 일일 무료 사용량 안에서 동작).
# ANTHROPIC_API_KEY secret을 넣으면 Claude가 우선 쓰입니다.
[ai]
binding = "AI"

# 아래 세 값은 절대 이 파일에 적지 말고 secret으로 넣습니다.
#   npx wrangler secret put CODEF_CLIENT_ID
#   npx wrangler secret put CODEF_CLIENT_SECRET
