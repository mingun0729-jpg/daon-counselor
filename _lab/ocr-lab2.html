<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>OCR lab2</title>
<style>body{font-family:system-ui;padding:12px}pre{white-space:pre-wrap;font-size:12px;border:1px solid #ccc;padding:8px}</style>
</head><body>
<pre id="out">loading…</pre>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
window.__results = []; window.__done = false;
const out = document.getElementById('out');
function log(s){ out.textContent += '\n' + s; }
function loadImg(src){ return new Promise((res, rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
function toCanvas(img, w, crop){
  let sx=0, sy=0, sw=img.naturalWidth, sh=img.naturalHeight;
  if (crop) { sx=crop[0]*sw; sy=crop[1]*sh; sw=crop[2]*sw; sh=crop[3]*sh; }
  const scale = w / sw;
  const c = document.createElement('canvas');
  c.width = Math.round(sw*scale); c.height = Math.round(sh*scale);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function grayCanvas(c){ const ctx=c.getContext('2d'); const d=ctx.getImageData(0,0,c.width,c.height); const p=d.data;
  for(let i=0;i<p.length;i+=4){ const g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2]; p[i]=p[i+1]=p[i+2]=g; } ctx.putImageData(d,0,0); return c; }
function contrastStretch(c, loPct=2, hiPct=98){ const ctx=c.getContext('2d'); const d=ctx.getImageData(0,0,c.width,c.height); const p=d.data;
  const hist=new Array(256).fill(0); const n=p.length/4;
  for(let i=0;i<p.length;i+=4) hist[p[i]]++;
  let lo=0,hi=255,acc=0;
  for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>= n*loPct/100){ lo=v; break; } }
  acc=0; for(let v=255;v>=0;v--){ acc+=hist[v]; if(acc>= n*(100-hiPct)/100){ hi=v; break; } }
  const span=Math.max(1,hi-lo);
  for(let i=0;i<p.length;i+=4){ let v=(p[i]-lo)*255/span; v=v<0?0:v>255?255:v; p[i]=p[i+1]=p[i+2]=v; }
  ctx.putImageData(d,0,0); return c; }
function sharpen(c, amount=0.6){ const ctx=c.getContext('2d'); const src=ctx.getImageData(0,0,c.width,c.height); const w=c.width,h=c.height;
  const outImg=ctx.createImageData(w,h); const s=src.data, o=outImg.data; const k=[0,-1,0,-1,5,-1,0,-1,0];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=(y*w+x)*4; let acc=0;
    for(let ky=-1;ky<=1;ky++) for(let kx=-1;kx<=1;kx++){ const yy=Math.min(h-1,Math.max(0,y+ky)), xx=Math.min(w-1,Math.max(0,x+kx)); acc += s[(yy*w+xx)*4]*k[(ky+1)*3+(kx+1)]; }
    const v = s[i]*(1-amount) + acc*amount; o[i]=o[i+1]=o[i+2]=Math.max(0,Math.min(255,v)); o[i+3]=255; }
  ctx.putImageData(outImg,0,0); return c; }
function otsu(c){ const ctx=c.getContext('2d'); const d=ctx.getImageData(0,0,c.width,c.height); const p=d.data;
  const hist=new Array(256).fill(0); for(let i=0;i<p.length;i+=4) hist[p[i]]++;
  const total=p.length/4; let sum=0; for(let v=0;v<256;v++) sum+=v*hist[v];
  let sumB=0,wB=0,max=0,thr=127;
  for(let v=0;v<256;v++){ wB+=hist[v]; if(!wB) continue; const wF=total-wB; if(!wF) break; sumB+=v*hist[v];
    const mB=sumB/wB, mF=(sum-sumB)/wF, between=wB*wF*(mB-mF)*(mB-mF); if(between>max){max=between;thr=v;} }
  for(let i=0;i<p.length;i+=4){ const v=p[i]>thr?255:0; p[i]=p[i+1]=p[i+2]=v; } ctx.putImageData(d,0,0); return c; }

const CROP = [0.095, 0.115, 0.81, 0.765];
async function run(){
  const img = await loadImg('card.png');
  const jobs = [
    { name:'gray2000',  img: sharpen(contrastStretch(grayCanvas(toCanvas(img,2000)))), lang:'kor+eng', psm:'6' },
    { name:'gray2600',  img: sharpen(contrastStretch(grayCanvas(toCanvas(img,2600)))), lang:'kor+eng', psm:'6' },
    { name:'gray3000',  img: sharpen(contrastStretch(grayCanvas(toCanvas(img,3000)))), lang:'kor+eng', psm:'6' },
    { name:'cropgray2400', img: sharpen(contrastStretch(grayCanvas(toCanvas(img,2400,CROP)))), lang:'kor+eng', psm:'6' },
    { name:'color2600', img: toCanvas(img,2600), lang:'kor+eng', psm:'6' },
    { name:'gray2000kor', img: sharpen(contrastStretch(grayCanvas(toCanvas(img,2000)))), lang:'kor', psm:'6' },
    { name:'bin2600',   img: otsu(contrastStretch(grayCanvas(toCanvas(img,2600)))), lang:'kor+eng', psm:'6' },
    { name:'cropgray2400psm3', img: sharpen(contrastStretch(grayCanvas(toCanvas(img,2400,CROP)))), lang:'kor+eng', psm:'3' }
  ];
  const workers = {};
  let t0 = performance.now();
  for (const j of jobs) {
    if (!workers[j.lang]) workers[j.lang] = await Tesseract.createWorker(j.lang, 1, { logger: ()=>{} });
    const w = workers[j.lang];
    await w.setParameters({ tessedit_pageseg_mode: j.psm, preserve_interword_spaces: '1' });
    const tb = performance.now();
    const r = await w.recognize(j.img.toDataURL('image/png'));
    window.__results.push({ name:j.name, lang:j.lang, psm:j.psm, ms:Math.round(performance.now()-tb), conf:r.data.confidence, text:r.data.text,
      lines:(r.data.lines||[]).map(l=>({t:l.text,c:l.confidence})) });
    log('ok ' + j.name + ' ' + r.data.confidence.toFixed(1) + ' ' + Math.round(performance.now()-tb) + 'ms');
  }
  for (const k in workers) await workers[k].terminate();
  window.__done = true;
  log('DONE total ' + Math.round(performance.now()-t0) + 'ms');
}
run().catch(e=>{ window.__err=String(e); out.textContent += '\nERROR '+e; window.__done=true; });
</script>
</body></html>
