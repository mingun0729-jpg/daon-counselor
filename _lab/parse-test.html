<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>OCR parse test</title>
<style>body{font-family:system-ui;padding:12px}pre{white-space:pre-wrap;font-size:12px;border:1px solid #ccc;padding:8px}</style>
</head><body>
<pre id="out">running…</pre>
<script>
window.__done = false; window.__out = null;
const TEXTS = {
  bin: "| =n 장애인등록증 (복지카드)\n성 _ 명 、 김다온\n주민등록번호 .810716-1*****\n| 장애유형  지체장애 (심한 장애)\n@ UO    |\n등록일  2024.05.10\nwoz _ 진주시장   71   /  |\nEa    SEI\nUR ME |시장인.",
  gray: "그             드근즈              |\n @) =x=nw 장애인등록증 (복지카드)    [0281\n텔 성 명 킴다온                    =\n| 주민등록번호 _810716-1**저*         -     =\n~  —                      A 8, 0 7)    = : =\n| 장애유형 _ 지체장애 (심한장애)     we      FE\n| 등록일    2024.05.10         py 9     =\n| mmm _ 진주시장    =  |    /    ==",
  crop: "@)==== 장애인등록증 (복지카드)        |\n성 8B REE                       |\n주민등록번호 _810716-1**처**      개   |\n\nVo ul\n장애유형         지체장애 (심한 장애)                      =                     [\n등록일     2024.05.10          y      -    |\n발급기관    진주시장       ~ Bre |    =     |",
  variant2: "장애인등록증\n성명 : 이하늘\n주민등록번호 930214-2******\n장애유형 청각장애 (심하지 않은 장애)\n등록일 2023.09.04\n발급기관 창원시장\n유효기간 2023.09.04 ~ 2033.09.03",
  variant3: "성명 박다온\n주민등록번호 050120-4******\n장애 유형 지적장애 (심한 장애)\n등록일 2025-01-20\n발급기관 진주시장"
};
async function run(){
  const html = await (await fetch('../index.html', {cache:'no-store'})).text();
  const a = html.indexOf('5-C. 읽은 글자에서');
  const b = html.indexOf('function openOcrReview');
  if (a < 0 || b < 0) { throw new Error('marker not found'); }
  const block = html.slice(html.indexOf('*/', a) + 2, b);
  const api = new Function(block + '\nreturn { parseOcrText: parseOcrText, mergeOcrPasses: mergeOcrPasses, ocrConfLevel: ocrConfLevel, ocrFixSurname: ocrFixSurname };')();
  const result = {};
  for (const k of Object.keys(TEXTS)) { result[k] = api.parseOcrText(TEXTS[k]); }
  result.__merge_sample = api.mergeOcrPasses([{text:TEXTS.bin, conf:69},{text:TEXTS.gray, conf:63},{text:TEXTS.crop, conf:76}]);
  window.__out = result;
  document.getElementById('out').textContent = JSON.stringify(result, null, 1);
  window.__done = true;
}
run().catch(e => { document.getElementById('out').textContent = 'ERROR ' + e; window.__err = String(e); window.__done = true; });
</script>
</body></html>
