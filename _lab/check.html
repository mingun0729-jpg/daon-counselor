<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>다온 375px 검증</title>
<style>
body{margin:0;background:#d8ddd8;font-family:system-ui;-webkit-text-size-adjust:100%}
#rep{padding:8px 10px;font-size:12px;line-height:1.5;white-space:pre-wrap;background:#fff;border-bottom:1px solid #999;font-family:ui-monospace,Menlo,Consolas,monospace}
.frame{width:375px;height:812px;border:1px solid #888;background:#fff;margin:8px}
</style></head>
<body>
<div id="rep">…</div>
<iframe id="fr" class="frame" title="375px 미리보기"></iframe>
<script>
var Q = new URLSearchParams(location.search);
var BIG = Q.get('big') === '1';
var CONTRAST = Q.get('contrast') === '1';
var WIDTH = parseInt(Q.get('w') || '375', 10) || 375;
var HEIGHT = parseInt(Q.get('h') || '812', 10) || 812;
window.__errs = [];
window.__log = [];
try {
  localStorage.removeItem('daon.state.v1');
  localStorage.setItem('daon.a11y.v1', JSON.stringify({ big: BIG, contrast: CONTRAST, voice: false, rate: 0.82 }));
} catch (e) { window.__log.push('ls: ' + e); }
var fr = document.getElementById('fr');
function attach() {
  var w = fr.contentWindow;
  try {
    w.addEventListener('error', function (e) { window.__errs.push('error: ' + (e.message || '') + ' @' + (e.lineno||'')); });
    w.addEventListener('unhandledrejection', function (e) {
      var r = e.reason; window.__errs.push('rejection: ' + ((r && r.message) || r));
    });
    var oe = w.onerror;
    w.onerror = function (m, s, l) { window.__errs.push('onerror: ' + m + ' @' + l); if (oe) { try { oe.apply(this, arguments); } catch (x) {} } };
  } catch (e) { window.__log.push('attach: ' + e); }
  setTimeout(measure, 500);
}
function measure() {
  var d = fr.contentDocument;
  if (!d || !d.documentElement) { return null; }
  var de = d.documentElement;
  var sw = de.scrollWidth, cw = de.clientWidth;
  var wide = [];
  var nodes = d.querySelectorAll('body *');
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i];
    var r = el.getBoundingClientRect();
    if (r.width && r.right > cw + 1 && el.offsetParent !== null) {
      var cs = fr.contentWindow.getComputedStyle(el);
      if (cs.position !== 'fixed' && cs.overflow !== 'hidden') {
        wide.push((el.id ? '#' + el.id : el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.split(' ')[0] : '')) + ' right=' + Math.round(r.right));
      }
    }
  }
  var out = { big: BIG, scrollWidth: sw, clientWidth: cw, overflow: sw > cw, wide: wide.slice(0, 8), errs: window.__errs, bodyClass: d.body.className };
  document.getElementById('rep').textContent = JSON.stringify(out, null, 1);
  window.__result = out;
  return out;
}
fr.style.width = WIDTH + 'px';
fr.style.height = HEIGHT + 'px';
fr.addEventListener('load', function () { window.__log.push('load'); attach(); });
fr.src = '../index.html?check=' + Date.now();
window.__measure = measure;
</script>
</body></html>
